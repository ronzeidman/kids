<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>תבנית פלטפורמר</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      #platformer-screen { display: flex; flex-direction: column; }
      #game-canvas { display: block; margin: 0 auto; background: #87ceeb; border-radius: 8px; max-width: 100%; }
      .hint, #status { text-align: center; }
      #status { font-weight: bold; font-size: 1.2rem; margin: 0.3rem 0; }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="screen game-screen active" id="platformer-screen">
        <header class="game-header">
          <button class="back-btn" data-back>חזרה</button>
          <h2>תבנית פלטפורמר</h2>
        </header>
        <div id="status" dir="rtl"></div>
        <canvas id="game-canvas" width="900" height="500"></canvas>
        <p class="hint">חצים לזוז · רווח לקפוץ · D להציג את ההיט-בוקסים</p>
      </section>
    </main>
    <script src="../../shared/utils.js"></script>
    <script src="../../shared/ui.js"></script>
    <script src="assets/sheet-meta.js"></script>
    <script src="https://unpkg.com/kaplay@3001.0.18/dist/kaplay.js"></script>
    <script src="game.js"></script>
  </body>
</html>
