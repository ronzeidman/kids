<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>חללית נסתרת</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="app">
      <section class="screen game-screen active" id="spacebeam-screen">
        <header class="game-header">
          <button class="back-btn" data-back>חזרה</button>
          <h2>חללית נסתרת 🚀</h2>
        </header>
        <canvas id="sb-canvas" width="480" height="288"></canvas>
        <div class="sb-touch">
          <button class="sb-btn" id="sb-btn-left">◀</button>
          <button class="sb-btn sb-btn-jump" id="sb-btn-jump">קפיצה ⬆</button>
          <button class="sb-btn" id="sb-btn-right">▶</button>
        </div>
      </section>
    </main>
    <script src="../../shared/utils.js"></script>
    <script src="../../shared/ui.js"></script>
    <script src="game.js"></script>
  </body>
</html>
