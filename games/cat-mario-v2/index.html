<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מריו חתולים החדש</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      #cm2-screen { display: flex; flex-direction: column; align-items: center; }
      #game-canvas { display: block; margin: 8px auto; background: #87ceeb;
                     border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.2);
                     max-width: 100%; height: auto; }
      .hint { text-align: center; font-size: 1.05rem; }
      #hud { position: relative; width: 100%; max-width: 900px; text-align: center;
             font-size: 1.4rem; font-weight: bold; margin: 4px auto; }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="screen game-screen active" id="cm2-screen">
        <header class="game-header">
          <button class="back-btn" data-back>חזרה</button>
          <h2>🐱 מריו חתולים החדש</h2>
        </header>
        <p class="hint">חצים לזוז · רווח לקפוץ · אסוף את הדגים והגע לדגל · D להציג היט-בוקסים</p>
        <div id="hud">🐟 <span id="fish-count">0</span> / <span id="fish-total">0</span></div>
        <canvas id="game-canvas" width="900" height="500"></canvas>
      </section>
    </main>
    <script src="../../shared/utils.js"></script>
    <script src="../../shared/ui.js"></script>
    <script src="https://unpkg.com/kaplay@3001.0.18/dist/kaplay.js"></script>
    <script src="game.js"></script>
  </body>
</html>
